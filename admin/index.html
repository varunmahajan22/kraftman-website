<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Kraftman Packaging: website admin</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend+Exa:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    /* The website's admin. One page; each screen is drawn into #main by the script below.
       Same language as the site: Inter and Lexend Exa, ink, paper, and gold as the only accent. */
    :root { --ink: #0b0b0c; --paper: #fff; --mist: #f4f4f2; --muted: #6b6b6f; --line: rgba(11,11,12,.14); --gold: #C8860A; --red: #b3261e; --green: #1f7a3d;
      --display: 'Lexend Exa', 'Inter', sans-serif; --text: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font: 400 14px/1.5 var(--text); color: var(--ink); background: var(--mist); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    h1 { font: 300 1.5rem/1.25 var(--display); letter-spacing: -.02em; }
    h2 { font: 400 1rem/1.3 var(--display); }
    h3 { font: 600 .68rem var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    /* Layout */
    #app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
    #side { background: var(--ink); color: var(--paper); padding: 22px 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
    #side .brand { padding: 0 22px 22px; font: 400 .74rem var(--display); letter-spacing: .24em; text-transform: uppercase; }
    #side .brand small { display: block; margin-top: 6px; font: 400 .7rem var(--text); letter-spacing: .04em; text-transform: none; color: rgba(255,255,255,.55); }
    #nav button { display: flex; justify-content: space-between; width: 100%; padding: 11px 22px; text-align: left; color: rgba(255,255,255,.72); font-size: .9rem; border-left: 3px solid transparent; }
    #nav button:hover { color: var(--paper); }
    #nav button.on { color: var(--paper); border-left-color: var(--gold); background: rgba(255,255,255,.06); }
    #nav .count { background: var(--gold); color: var(--paper); border-radius: 10px; padding: 0 7px; font-size: .72rem; font-weight: 600; }
    #nav hr { border: 0; border-top: 1px solid rgba(255,255,255,.12); margin: 10px 22px; }
    #side .foot { margin-top: auto; padding: 0 22px; font-size: .8rem; color: rgba(255,255,255,.6); display: grid; gap: 8px; }
    #side .foot button, #side .foot a { color: rgba(255,255,255,.8); text-align: left; text-decoration: underline; font-size: .8rem; }
    #main { padding: 34px clamp(20px, 4vw, 52px) 120px; min-width: 0; max-width: 1180px; }
    .head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; margin-bottom: 26px; }
    .head p { color: var(--muted); max-width: 62ch; margin-top: 6px; }

    /* Pieces */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
    .btn:hover { background: var(--gold); border-color: var(--gold); }
    .btn.ghost { background: var(--paper); color: var(--ink); border-color: var(--line); }
    .btn.ghost:hover { border-color: var(--ink); background: var(--paper); }
    .btn.danger { background: var(--paper); color: var(--red); border-color: rgba(179,38,30,.4); }
    .btn.danger:hover { background: var(--red); color: var(--paper); border-color: var(--red); }
    .btn:disabled { opacity: .45; cursor: default; }
    .link { text-decoration: underline; color: var(--muted); font-size: .8rem; }
    .link:hover { color: var(--ink); }
    .card { background: var(--paper); border: 1px solid var(--line); padding: 20px; margin-bottom: 14px; }
    .card > h2 { margin-bottom: 4px; }
    .card > .note { color: var(--muted); font-size: .82rem; margin-bottom: 12px; }
    label.f { display: grid; gap: 5px; margin-top: 12px; font-size: .68rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    label.f span.c { float: right; font-weight: 400; letter-spacing: 0; text-transform: none; }
    label.f span.c.over { color: var(--red); font-weight: 600; }
    input[type=text], input[type=password], input[type=email], input[type=search], select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: var(--paper); font-size: .92rem; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink); border-radius: 0; }
    textarea { resize: vertical; min-height: 40px; line-height: 1.5; overflow: hidden; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .photo-row { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
    .chip { display: inline-block; padding: 2px 9px; font-size: .68rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
    .chip.draft { border-color: var(--gold); color: var(--gold); }
    .chip.published, .chip.on { border-color: var(--green); color: var(--green); }
    .chip.new { background: var(--gold); border-color: var(--gold); color: var(--paper); }
    table.t { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--line); }
    table.t th, table.t td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.t th { font-size: .66rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    table.t tr.click { cursor: pointer; }
    table.t tr.click:hover { background: var(--mist); }
    pre.msg { white-space: pre-wrap; font: 400 .86rem/1.55 var(--text); background: var(--mist); padding: 14px; margin-top: 8px; }

    /* Pictures */
    .pic { position: relative; background: var(--mist) center / cover no-repeat; aspect-ratio: 4 / 3; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: .8rem; text-align: center; overflow: hidden; }
    .pic.logo { aspect-ratio: 2 / 1; background-size: contain; background-color: var(--paper); }
    .pic.square { aspect-ratio: 1; background-size: contain; background-color: var(--paper); }
    .tile { background: var(--paper); border: 1px solid var(--line); padding: 10px; display: grid; gap: 8px; align-content: start; }
    .tile[draggable=true] { cursor: grab; }
    .tile.dragging { opacity: .4; }
    .tile.off .pic { opacity: .4; }
    .tile .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
    .drop { display: grid; place-items: center; gap: 6px; padding: 22px; border: 1px dashed rgba(11,11,12,.4); text-align: center; cursor: pointer; background: var(--paper); color: var(--muted); }
    .drop:hover, .drop.over { border-color: var(--gold); color: var(--gold); }
    .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    /* Page editor */
    .item { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
    .item:first-of-type { border-top: 0; }
    .item .pair { display: grid; grid-template-columns: minmax(140px, 3fr) 7fr; gap: 8px; }
    .cols { display: grid; gap: 8px; }
    .item .tools { display: flex; gap: 2px; }
    .item .tools button { width: 28px; height: 30px; border: 1px solid var(--line); color: var(--muted); background: var(--paper); }
    .item .tools button:hover { border-color: var(--ink); color: var(--ink); }
    .add { margin-top: 8px; }
    #bar { position: fixed; left: 232px; right: 0; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px clamp(20px, 4vw, 52px); background: var(--paper); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(0,0,0,.05); }
    #bar .say { margin-right: auto; font-size: .86rem; }
    #bar .say.err { color: var(--red); }

    /* Toast, dialog, login */
    #toast { position: fixed; right: 22px; top: 22px; z-index: 30; padding: 12px 18px; background: var(--ink); color: var(--paper); font-size: .88rem; opacity: 0; transform: translateY(-8px); transition: opacity .2s, transform .2s; pointer-events: none; max-width: 420px; }
    #toast.show { opacity: 1; transform: none; }
    #toast.err { background: var(--red); }
    #veil { position: fixed; inset: 0; z-index: 20; background: rgba(11,11,12,.6); display: grid; place-items: center; padding: 20px; }
    #dialog { background: var(--paper); padding: 24px; width: min(760px, 100%); max-height: 92vh; overflow: auto; }
    #dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .crop { position: relative; margin-top: 14px; background: #222; user-select: none; touch-action: none; line-height: 0; }
    .crop img { width: 100%; height: auto; display: block; opacity: .45; }
    .crop .frame { position: absolute; border: 2px solid var(--gold); box-shadow: 0 0 0 4000px rgba(0,0,0,.0); cursor: move; background: center / cover no-repeat; overflow: hidden; }
    #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: var(--ink); }
    #login form { background: var(--paper); padding: 34px; width: min(380px, 100%); }
    #login .btn { width: 100%; justify-content: center; margin-top: 20px; padding: 13px; }
    #login .err { color: var(--red); min-height: 1.4em; margin-top: 12px; font-size: .86rem; }
    @media (max-width: 820px) {
      #app { grid-template-columns: 1fr; }
      #side { position: static; height: auto; }
      #nav { display: flex; flex-wrap: wrap; }
      #nav button { width: auto; border-left: 0; }
      #nav hr { display: none; }
      #bar { left: 0; }
      .two, .item .pair, .photo-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div id="login" hidden>
    <form id="loginForm" autocomplete="on">
      <h1>Website admin</h1>
      <p class="muted" style="margin-top:6px">Kraftman Packaging</p>
      <label class="f">Username<input name="username" type="text" autocomplete="username" required /></label>
      <label class="f">Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <button class="btn" type="submit">Log in</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <aside id="side">
      <div class="brand">Kraftman Packaging<small>Website admin</small></div>
      <nav id="nav"></nav>
      <div class="foot">
        <span id="who"></span>
        <a href="/" target="_blank" rel="noopener">Open the website</a>
        <button type="button" id="logout">Log out</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>

  <div id="bar" hidden></div>
  <div id="veil" hidden><div id="dialog" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Kraftman Packaging — website admin

   Screens: Dashboard, Products, Clients, Pages, Certifications,
   Enquiries, Image library, and for owners Contact details and Users.
   Each screen is a function that draws itself into #main. Nothing is
   written with innerHTML from data: el() builds every node, so text
   typed by an editor can never become markup.

   The server decides what a login may do (routes/cms.js); hiding a
   screen here is only a convenience.
   ═══════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const API = '/admin/api', CMS = API + '/cms';
  let me = null, dirty = false;                    // dirty: the page editor has changes that are not saved

  /* ── Small tools ─────────────────────────────────────────────────── */
  // el('div.card', { onclick }, child, 'text', [more]) → a DOM node
  function el(spec, ...rest) {
    const [tag, ...classes] = spec.split('.'), node = document.createElement(tag || 'div');
    if (classes.length) node.className = classes.join(' ');
    rest.forEach(function add(part) {
      if (part == null || part === false) return;
      if (Array.isArray(part)) return part.forEach(add);
      if (part instanceof Node) return node.appendChild(part);
      if (typeof part === 'object') {
        return Object.keys(part).forEach(k => {
          if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), part[k]);
          else if (k === 'style') node.style.cssText = part[k];
          else if (k in node && k !== 'list') node[k] = part[k];
          else node.setAttribute(k, part[k]);
        });
      }
      node.appendChild(document.createTextNode(String(part)));
    });
    return node;
  }
  function toast(text, isError) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'show' + (isError ? ' err' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { t.className = ''; }, isError ? 6000 : 2600);
  }
  async function api(method, url, body) {
    const opts = { method, headers: { Authorization: 'Bearer ' + (localStorage.getItem('kp_token') || '') } };
    if (body instanceof FormData) opts.body = body;
    else if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const res = await fetch(url, opts);
    const data = (res.headers.get('content-type') || '').indexOf('json') >= 0 ? await res.json() : await res.blob();
    // A missing or expired login sends you back to the login screen; "you may not do this" is just a message.
    if (res.status === 401 || (res.status === 403 && /token/i.test((data && data.error) || ''))) { showLogin(); throw new Error('Please log in again.'); }
    if (!res.ok) throw new Error((data && data.error) || 'That did not work.');
    return data;
  }
  // Run something that talks to the server; show what went wrong if it fails.
  const run = (work, done) => Promise.resolve().then(work).then(r => { if (done) toast(done); return r; }).catch(err => { toast(err.message, true); throw err; });
  const when = iso => (iso ? new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
  const field = (label, input, extra) => el('label.f', el('span', label, extra || null), input);
  const header = (title, about, actions) => el('div.head', el('div', el('h1', title), about ? el('p', about) : null), el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, actions || []));
  const picker = (label, multiple, onFiles) => {
    const input = el('input', { type: 'file', accept: 'image/*', multiple: !!multiple, onchange: e => { if (e.target.files.length) onFiles(Array.from(e.target.files)); e.target.value = ''; } });
    const box = el('label.drop', input, el('strong', label), el('span.small', 'Any size or shape. It is fitted automatically.'));
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('over'); });
    box.addEventListener('dragleave', () => box.classList.remove('over'));
    box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('over'); const files = Array.from(e.dataTransfer.files).filter(f => /^image\//.test(f.type)); if (files.length) onFiles(multiple ? files : files.slice(0, 1)); });
    return box;
  };
  const pic = (url, kind, empty) => el('div.pic' + (kind ? '.' + kind : ''), url ? { style: 'background-image:url("' + encodeURI(url) + '")' } : null, url ? null : empty || 'No picture yet');
  // Let tiles be dragged into a new order; calls done(ids) with the order they end in.
  function sortable(container, done) {
    let moving = null;
    container.addEventListener('dragstart', e => { moving = e.target.closest('[data-id]'); if (moving) moving.classList.add('dragging'); });
    container.addEventListener('dragend', () => { if (!moving) return; moving.classList.remove('dragging'); moving = null; done(Array.from(container.querySelectorAll('[data-id]')).map(n => +n.dataset.id)); });
    container.addEventListener('dragover', e => {
      e.preventDefault();
      const over = e.target.closest('[data-id]');
      if (!moving || !over || over === moving) return;
      const box = over.getBoundingClientRect(), after = e.clientX > box.left + box.width / 2;
      container.insertBefore(moving, after ? over.nextSibling : over);
    });
  }

  /* ── Dialogs ─────────────────────────────────────────────────────── */
  function dialog(nodes) { const d = $('dialog'); d.textContent = ''; [].concat(nodes).forEach(n => n && d.appendChild(n)); $('veil').hidden = false; fitAll(); }
  const closeDialog = () => { $('veil').hidden = true; };
  $('veil').addEventListener('click', e => { if (e.target === $('veil')) closeDialog(); });
  function confirmBox(question, yes, action) {
    dialog([el('h2', question), el('div.actions', el('button.btn.ghost', { type: 'button', onclick: closeDialog }, 'Cancel'),
      el('button.btn.danger', { type: 'button', onclick: () => { closeDialog(); action(); } }, yes))]);
  }
  // Choose which part of a picture is kept. `image` is { url, original, slot }; save(focus) does the cut.
  function cropBox(image, save) {
    if (!image.original) return toast('The original of this picture is not on the server, so it cannot be cropped again. Upload it once more.', true);
    const ratio = 4 / 3, img = el('img', { src: image.original, alt: '' }), frame = el('div.frame');
    const stage = el('div.crop', img, frame);
    let fx = (image.focus || [0.5, 0.5])[0], fy = (image.focus || [0.5, 0.5])[1], fw = 1, fh = 1;
    const place = () => {
      const w = img.clientWidth, h = img.clientHeight;
      if (!w) return;
      const k = Math.min(w / ratio, h);            // the largest 4:3 window that fits the picture
      fw = k * ratio / w; fh = k / h;
      fx = Math.min(1 - fw / 2, Math.max(fw / 2, fx)); fy = Math.min(1 - fh / 2, Math.max(fh / 2, fy));
      frame.style.cssText = 'left:' + (fx - fw / 2) * 100 + '%;top:' + (fy - fh / 2) * 100 + '%;width:' + fw * 100 + '%;height:' + fh * 100 + '%;' +
        'background-image:url("' + encodeURI(image.original) + '");background-size:' + 100 / fw + '% ' + 100 / fh + '%;background-position:' +
        (fw < 1 ? (fx - fw / 2) / (1 - fw) * 100 : 0) + '% ' + (fh < 1 ? (fy - fh / 2) / (1 - fh) * 100 : 0) + '%';
    };
    img.addEventListener('load', place);
    let from = null;
    stage.addEventListener('pointerdown', e => { from = { x: e.clientX, y: e.clientY, fx, fy }; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointermove', e => { if (!from) return; fx = from.fx + (e.clientX - from.x) / img.clientWidth; fy = from.fy + (e.clientY - from.y) / img.clientHeight; place(); });
    stage.addEventListener('pointerup', () => { from = null; });
    dialog([el('h2', 'Choose what stays in the picture'), el('p.muted', 'Drag the bright frame. Everything outside it is cut off.'), stage,
      el('div.actions', el('button.btn.ghost', { type: 'button', onclick: closeDialog }, 'Cancel'),
        el('button.btn', { type: 'button', onclick: () => { closeDialog(); save([fx, fy]); } }, 'Use this crop'))]);
  }

  /* ── Login ───────────────────────────────────────────────────────── */
  function showLogin() { $('app').hidden = true; $('bar').hidden = true; $('login').hidden = false; }
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target;
    $('loginErr').textContent = '';
    try {
      const res = await fetch(API + '/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: f.username.value, password: f.password.value }) });
      const data = await res.json();
      if (!res.ok) throw new Error(res.status === 429 ? 'Too many attempts. Wait a few minutes.' : 'That username and password do not match.');
      localStorage.setItem('kp_token', data.token);
      f.reset();
      start();
    } catch (err) { $('loginErr').textContent = err.message; }
  });
  $('logout').addEventListener('click', () => { localStorage.removeItem('kp_token'); showLogin(); });

  /* ── Navigation ──────────────────────────────────────────────────── */
  const SCREENS = [
    ['dashboard', 'Dashboard'], ['products', 'Products'], ['clients', 'Clients'], ['pages', 'Pages'], ['certifications', 'Certifications'],
    null, ['enquiries', 'Enquiries'], ['library', 'Image library'], null, ['contact', 'Contact details', true], ['users', 'Users', true], ['password', 'My password'],
  ];
  const screens = {};
  let current = 'dashboard', newEnquiries = 0;
  function drawNav() {
    const nav = $('nav'); nav.textContent = '';
    SCREENS.forEach(s => {
      if (!s) return nav.appendChild(el('hr'));
      if (s[2] && me.role !== 'owner') return;
      nav.appendChild(el('button' + (s[0] === current ? '.on' : ''), { type: 'button', onclick: () => go(s[0]) }, s[1], s[0] === 'enquiries' && newEnquiries ? el('span.count', newEnquiries) : null));
    });
  }
  function go(name, arg) {
    if (dirty && !window.confirm('This page has changes that are not saved. Leave without saving?')) return;
    dirty = false; current = name; $('bar').hidden = true;
    drawNav();
    $('main').textContent = '';
    window.scrollTo(0, 0);
    run(() => screens[name](arg));
  }
  const main = (...nodes) => { const m = $('main'); m.textContent = ''; nodes.forEach(function add(n) { if (Array.isArray(n)) n.forEach(add); else if (n) m.appendChild(n); }); fitAll(); };
  // Text boxes grow to show everything typed in them, so nothing is hidden behind a scrollbar.
  const fit = t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
  const fitAll = () => requestAnimationFrame(() => document.querySelectorAll('textarea').forEach(fit));
  document.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA') fit(e.target); });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  /* ── Dashboard ───────────────────────────────────────────────────── */
  screens.dashboard = async () => {
    const [stats, pages, fams] = await Promise.all([api('GET', API + '/stats'), api('GET', CMS + '/pages'), api('GET', CMS + '/families')]);
    newEnquiries = stats.enquiries_new; drawNav();
    const drafts = pages.filter(p => p.status === 'draft'), photos = fams.reduce((n, f) => n + f.gallery.filter(g => g.image).length, 0);
    const tile = (n, label, to) => el('button.card', { type: 'button', style: 'text-align:left;margin:0', onclick: () => go(to) }, el('h1', String(n)), el('p.muted', label));
    main(header('Dashboard', 'Hello, ' + me.username + '. This is where the website is kept up to date.'),

        el('p', { style: 'margin-top:14px' }, el('button.btn', { type: 'button', onclick: () => run(() => { const body = {}; Object.keys(inputs).forEach(k => { body[k] = inputs[k].value.trim(); }); return api('PUT', API + '/settings', body); }, 'Saved.') }, 'Save'))),
      el('div.card', el('h2', 'Logo'), el('p.note', 'Used in the header and footer of every page, in Kraftman 3D Studio and in its watermark.'),
        el('div.photo-row', logo, picker('Replace the logo', false, files => run(async () => { const form = new FormData(); form.append('image', files[0]); const up = await api('POST', API + '/upload', form); await api('PUT', API + '/settings', { site_logo: up.url }); await screens.contact(); }, 'Logo replaced.')))));
  };

  /* ── Users (owner) and my password ───────────────────────────────── */
  screens.users = async () => {
    const users = await api('GET', CMS + '/users'), again = () => screens.users();
    const setPassword = u => {
      const p = el('input', { type: 'password', autocomplete: 'new-password' });
      dialog([el('h2', 'New password for ' + u.username), field('Password, at least 10 characters', p), el('div.actions', el('button.btn.ghost', { type: 'button', onclick: closeDialog }, 'Cancel'),
        el('button.btn', { type: 'button', onclick: () => run(async () => { await api('POST', CMS + '/users/' + u.id + '/password', { password: p.value }); closeDialog(); }, 'Password changed.') }, 'Change'))]);
    };
    const name = el('input', { type: 'text', autocomplete: 'off' }), pass = el('input', { type: 'password', autocomplete: 'new-password' });
    const role = el('select', el('option', { value: 'editor' }, 'Marketing: content, photos, clients'), el('option', { value: 'owner' }, 'Owner: everything'));
    main(header('Users', 'Give each person their own login. A marketing login can change pages, product photos, clients and certifications, but not contact details, users or other people\'s passwords.'),
      el('table.t', el('thead', el('tr', el('th', 'Username'), el('th', 'Can do'), el('th', 'Added'), el('th', ''))), el('tbody', users.map(u => el('tr', el('td', el('strong', u.username), u.id === me.id ? ' (you)' : ''),
        el('td', u.role === 'owner' ? 'Everything' : 'Content only'), el('td.muted', when(u.created_at)),
        el('td', el('button.link', { type: 'button', onclick: () => setPassword(u) }, 'Set password'), '  ', u.id === me.id ? null : el('button.link', { type: 'button', onclick: () => confirmBox('Remove the login "' + u.username + '"?', 'Remove', () => run(async () => { await api('DELETE', CMS + '/users/' + u.id); await again(); })) }, 'Remove')))))),
      el('div.card', { style: 'margin-top:14px' }, el('h2', 'Add a login'), el('div.two', field('Username', name), field('Password, at least 10 characters', pass)), field('What they can do', role),
        el('p', { style: 'margin-top:14px' }, el('button.btn', { type: 'button', onclick: () => run(async () => { await api('POST', CMS + '/users', { username: name.value, password: pass.value, role: role.value }); await again(); }, 'Login added.') }, 'Add login'))));
  };
  screens.password = async () => {
    const now = el('input', { type: 'password', autocomplete: 'current-password' }), next = el('input', { type: 'password', autocomplete: 'new-password' });
    main(header('My password', 'Change the password for ' + me.username + '.'),
      el('div.card', { style: 'max-width:460px' }, field('Current password', now), field('New password, at least 8 characters', next),
        el('p', { style: 'margin-top:14px' }, el('button.btn', { type: 'button', onclick: () => run(async () => { await api('POST', API + '/change-password', { current_password: now.value, new_password: next.value }); now.value = next.value = ''; }, 'Password changed.') }, 'Change password'))));
  };

  /* ── Start ───────────────────────────────────────────────────────── */
  async function start() {
    if (!localStorage.getItem('kp_token')) return showLogin();
    try { me = await api('GET', CMS + '/me'); } catch (e) { return showLogin(); }
    $('login').hidden = true; $('app').hidden = false;
    $('who').textContent = me.username + (me.role === 'owner' ? ' · owner' : ' · marketing');
    dirty = false;
    go('dashboard');
  }
  start();
})();
</script>
</body>
</html>
